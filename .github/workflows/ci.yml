name: CI

# Build, unit tests and type check. Runs on PRs and pushes to main. The
# supply-chain audit is a separate workflow (security-audit.yml).
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: this job only needs to read the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) to defend
      # against compromised-action supply-chain attacks. Dependabot keeps them
      # current via .github/dependabot.yml (github-actions ecosystem).
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Install exactly what the lockfile pins, with integrity verification and
      # without running package lifecycle scripts (same posture as
      # security-audit.yml).
      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check
